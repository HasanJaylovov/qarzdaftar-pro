name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Gradle 8.5
        run: |
          # Gradle wrapper'ni avtomatik yuklab olib ishlatish uchun gradlew scriptini chaqiramiz
          # Agar gradlew bo'lmasa, gradle setup orqali ta'minlaymiz
          chmod +x gradlew || true
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QarzDaftar-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
